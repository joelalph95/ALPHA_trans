<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ALPHA trans</title>
  <style>
    * {
      cursor: pointer;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8FAFC;
    }
    
    /* Amélioration du style des boutons et éléments interactifs */
    button, [role="button"], a, .clickable {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    button:hover, [role="button"]:hover, .clickable:hover {
      opacity: 0.85;
    }
    
    /* Scrollbar personnalisée */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1a1;
    }
    
    /* Conteneur principal */
    #root {
      height: 100vh;
      width: 100vw;
      overflow: auto;
    }
    
    /* Forcer le style des inputs */
    input, textarea, select {
      cursor: text;
    }
    
    /* Amélioration des iframes */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
